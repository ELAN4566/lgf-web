# MDS-Produktkatalog
#
# Ein Eintrag pro Artikel. Der Schlüssel (z. B. MDLIF5) ist die Artikelnummer:
#  - Adresse der Produktseite: /hardware/mdlif5/
#  - später Schlüssel für Preis/Lager aus der Datenbank (Shop)
#
# kategorie: decoder | interface | ledbus | komplett | zubehoer
# gruppe:    nur für Interface-Module (Schalten & Steuern, Belegtmeldung, ...)
# bild:      Pfad relativ zu dieser Datei
# punkte:    Aufzählung auf der Produktseite
# reihenfolge: Sortierung innerhalb der Kategorie (klein = zuerst)

# ---------------------------------------------------------------- Decoder

MDLIF5:
  name: MDS Universaldecoder
  kategorie: decoder
  reihenfolge: 1
  bild: ../assets/produkte/mdlif5.png
  kurz: Universeller und modularer Decoder für Weichen, Belegtmelder, Signale, Beleuchtung usw.
  punkte:
    - Aufnahme von 5 Interface-Modulen
    - Anschlussmöglichkeit LEDBUS
    - Kommunikation über WLAN
    - Onboard-Spannungswandler für 5 V und 3,3 V
    - Aufnahme von maximal 2 zusätzlichen DC/DC-Convertern

MDKSLB3:
  name: MDS Beleuchtungsdecoder
  kategorie: decoder
  reihenfolge: 2
  bild: ../assets/produkte/mdkslb3.png
  kurz: Decoder mit 3 Anschlüssen für LEDBUS, 2 beleuchteten Tasten und einem Lautsprecher.
  punkte:
    - 3 Anschlüsse für LEDBUS
    - 2 beleuchtete Tasten
    - Lautsprecher
    - Kommunikation über WLAN
    - Onboard-Spannungswandler für 5 V und 3,3 V

ADBAS5:
  name: MDS Basisadapter
  kategorie: decoder
  reihenfolge: 3
  bild: ../assets/produkte/adbas5.png
  kurz: Basisadapter zur Aufnahme eines Decoders MDLIF5.
  punkte:
    - Schraubklemmen für die Anschlüsse der Peripheriegeräte
    - Stecker für LEDBUS-Flachkabel
    - Konfigurationsmöglichkeit für Extern-Anschlüsse EXT A / EXT B

ADBAS5-S:
  name: MDS Basisadapter S88
  kategorie: decoder
  reihenfolge: 4
  bild: ../assets/produkte/adbas5-s.png
  kurz: Basisadapter für MDLIF5 mit zusätzlicher RJ45-Buchse für den S88N-Rückmeldebus.
  punkte:
    - Schraubklemmen für die Anschlüsse der Peripheriegeräte
    - Stecker für LEDBUS-Flachkabel
    - RJ45-Buchse für S88N-Rückmeldebus
    - Konfigurationsmöglichkeit für Extern-Anschlüsse EXT A / EXT B

ADBASE:
  name: MDS Basisadapter Typ E
  kategorie: decoder
  reihenfolge: 5
  bild: ../assets/produkte/adbase.png
  kurz: Basisadapter Typ E zur Aufnahme eines Decoders MDLIF5.

SABASE:
  name: Steckeradapter für ADBASE
  kategorie: decoder
  reihenfolge: 6
  bild: ../assets/produkte/sabase.png
  kurz: Steckeradapter für den Basisadapter ADBASE.

