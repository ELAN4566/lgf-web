# ---------------------------------------------------------------- Zubehör

CVSDC2:
  name: DC/DC-Converter 5 V / 12 V
  kategorie: zubehoer
  reihenfolge: 1
  bild: ../assets/produkte/cvsdc2.png
  kurz: Für die erweiterte Stromversorgung der Interface-Module und des LEDBUS.
  punkte:
    - Eingangsspannung 15 V bis ca. 24 V DC
    - Ausgangsspannung 5 V bis ca. 20 V DC, max. 1,0 A
    - Standardversion für +5 V DC und +12 V DC
