# ============================================================
# dmzsrv - nginx Reverse Proxy Konfiguration
# Domain: wortuhr.lgf.ch
# SSL: Let's Encrypt (Certbot, --webroot)
#
# Routing (SSL-Terminierung auf dmzsrv, intern HTTP):
#   /  -> appsrv:5104  nginx, statische Website (Astro, Repo lgf-web)
#
# Ablage: /etc/nginx/conf.d/wortuhr.conf
# Aufbau identisch mit www.conf (Snippets ssl-strong, proxy-headers,
# client-buffers, security-headers; Keepalive-Upstream).
# ============================================================

upstream appsrv_5104 {
    server appsrv:5104;
    keepalive 32;
}

# ------------------------------------------------------------
# HTTP to HTTPS Redirect (Port 80)
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name wortuhr.lgf.ch;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# HTTPS Hauptkonfiguration (Port 443)
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wortuhr.lgf.ch;

    ssl_certificate     /etc/letsencrypt/live/wortuhr.lgf.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wortuhr.lgf.ch/privkey.pem;

    include snippets/ssl-strong.conf;
    include snippets/proxy-headers.conf;
    include snippets/client-buffers.conf;
    include snippets/security-headers.conf;

    # --------------------------------------------------------
    # Statische Website - Port 5104
    # --------------------------------------------------------
    location / {
        proxy_pass          http://appsrv_5104/;
        proxy_http_version  1.1;
        include             snippets/proxy-headers.conf;
        proxy_set_header    Connection "";
        proxy_read_timeout  60s;

        # Sicherheits-Header kommen aus snippets/security-headers.conf (dmzsrv).
        # Gleichnamige Header von appsrv ausblenden, sonst doppelt/widerspruechlich.
        # Cache-Control und X-Robots-Tag von appsrv bleiben erhalten.
        proxy_hide_header   Content-Security-Policy;
        proxy_hide_header   X-Frame-Options;
        proxy_hide_header   X-Content-Type-Options;
        proxy_hide_header   Referrer-Policy;
        proxy_hide_header   Permissions-Policy;
    }
}

