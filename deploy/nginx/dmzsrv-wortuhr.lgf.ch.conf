# dmzsrv: TLS-Abschluss und Weiterleitung an appsrv
# Vorlage – Zertifikatspfade und appsrv-Adresse an die bestehende Konfiguration anpassen.

server {
    listen 80;
    listen [::]:80;
    server_name wortuhr.lgf.ch;

    # Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wortuhr.lgf.ch;

    ssl_certificate     /etc/letsencrypt/live/wortuhr.lgf.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wortuhr.lgf.ch/privkey.pem;
    # ssl_protocols / ciphers wie bei den übrigen Sites (z. B. include snippets/ssl.conf;)

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://10.1.1.54:5104;  # appsrv, wortuhr.conf
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
