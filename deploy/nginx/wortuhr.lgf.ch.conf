# appsrv (10.1.1.54): liefert die statischen Dateien der Wortuhr-Site aus.
# Alle Zugriffe kommen über dmzsrv (10.1.6.3), kein SSL – Terminierung auf dmzsrv.
# Port 5104: wortuhr.lgf.ch – /var/www/wortuhr  (Muster wie www.conf, Port 5102)
# Ablage: /etc/nginx/conf.d/wortuhr.conf
# Benötigt: snippets/lgf-security-headers.conf, conf.d/00-lgf-robots-map.conf

server {
    listen 5104;
    server_name wortuhr.lgf.ch;

    root  /var/www/wortuhr;
    index index.html;

    # Echte Besucher-IP vom dmzsrv übernehmen (für Logs)
    set_real_ip_from 10.1.6.3;            # dmzsrv
    real_ip_header   X-Forwarded-For;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/rss+xml font/ttf;

    # Seiten: /news/ -> /news/index.html; HTML immer neu prüfen lassen
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include snippets/lgf-security-headers.conf;
    }

    # Von Astro erzeugte Dateien haben einen Hash im Namen -> dürfen ewig gecacht werden
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/lgf-security-headers.conf;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/lgf-security-headers.conf;
    }

    error_page 404 /404.html;

    # --- Später: Shop-Backend (ASP.NET Core) ---------------------------------
    # location /api/shop/ {
    #     proxy_pass http://127.0.0.1:5080/;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    # }
}
