# Sicherheits-Header für alle LGF-Sites.
# Ablage auf jedem Webserver (appsrv, mvssrv, mvstestsrv):
#   /etc/nginx/snippets/lgf-security-headers.conf
# Wird in jedem location-Block eingebunden, weil nginx die add_header-Anweisungen
# der Server-Ebene verwirft, sobald ein location-Block eigene add_header hat.
# Benötigt die Map aus conf.d/00-lgf-robots-map.conf ($lgf_robots).

add_header X-Robots-Tag $lgf_robots always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
