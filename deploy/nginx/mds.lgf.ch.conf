# MDS-Website – gleiche Datei für Live und Test:
#   mvssrv      (mds.lgf.ch,     Branch deploy)
#   mvstestsrv  (mdstest.lgf.ch, Branch deploy-test, automatisch noindex)
# Ablage: /etc/nginx/conf.d/mds.lgf.ch.conf
# Benötigt: snippets/lgf-security-headers.conf, conf.d/00-lgf-robots-map.conf
#
# ACHTUNG: Die bestehende Konfiguration auf mvssrv/mvstestsrv für mds.lgf.ch
# (MdsClient, weitere Dienste) zuerst sichern und deren Pfade hier übernehmen.

server {
    listen 80;
    server_name mds.lgf.ch mdstest.lgf.ch;

    root  /var/www/mds;
    index index.html;

    set_real_ip_from 10.0.0.0/8;          # TODO: IP von dmzsrv
    real_ip_header   X-Forwarded-For;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;

    # --- Alte Zeta-Producer-Adressen umleiten (Google, Foren, Flyer) ---------
    location = /index.php           { return 301 /; }
    location = /konzept.html        { return 301 /konzept/; }
    location = /hardware.html       { return 301 /hardware/; }
    location = /decoder.html        { return 301 /hardware/#decoder; }
    location = /interfaces.html     { return 301 /hardware/#interface; }
    location = /ledbus-adapter.html { return 301 /hardware/#ledbus; }
    location = /zubehoer.html       { return 301 /hardware/#zubehoer; }
    location = /software.html       { return 301 /software/; }
    location = /download.html       { return 301 /download/; }
    location = /support.html        { return 301 /support/; }
    location = /kontakt.html        { return 301 /support/; }
    location = /impressum.html      { return 301 /impressum/; }
    location = /datenschutz.html    { return 301 /datenschutz/; }
    location ~ ^/(warenkorb|artikeldetail)\.php$ { return 301 /hardware/; }

    # --- Downloads: liegen ausserhalb des Repos, Adressen wie bisher ---------
    # PDFs: /var/www/downloads/mds/files/*.pdf
    location /media/files/ {
        alias /var/www/downloads/mds/files/;
        include snippets/lgf-security-headers.conf;
    }
    # MDS Controller ClickOnce-Installation
    # TODO Erich: Wo liegt /MdsClient heute? Entweder Ordner hierher kopieren
    #             (alias) oder an den bisherigen Server weiterleiten (proxy_pass).
    location /MdsClient {
        alias /var/www/downloads/mds/MdsClient;
        types { application/x-ms-application application; application/x-ms-manifest manifest; application/octet-stream deploy; }
    }

    # --- Seiten -------------------------------------------------------------
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include snippets/lgf-security-headers.conf;
    }
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/lgf-security-headers.conf;
    }

    error_page 404 /404.html;

    # --- Später: Shop-Backend (ASP.NET Core, Zugriff auf MVS-DB) ------------
    # location /api/shop/ {
    #     proxy_pass http://127.0.0.1:5080/;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    # }
}
