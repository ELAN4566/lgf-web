# appsrv (AlmaLinux): MVS-Website
# Ablage: /etc/nginx/conf.d/mvs.lgf.ch.conf
# Benötigt: /etc/nginx/snippets/lgf-security-headers.conf
#
# ACHTUNG: mvs.lgf.ch bedient vermutlich auch MVS-Serverdienste (MvsClient,
# Web-Ansicht der Sammlungen, APIs der Mobile App). Diese Pfade müssen vor der
# Umstellung erhoben und unten weitergeleitet werden.

server {
    listen 80;
    server_name mvs.lgf.ch;

    root  /var/www/mvs;
    index index.html;

    set_real_ip_from 10.0.0.0/8;          # TODO: IP von dmzsrv
    real_ip_header   X-Forwarded-For;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;

    # --- Alte Zeta-Producer-Adressen umleiten -------------------------------
    location = /index.html          { return 301 /; }
    location = /applikation.html    { return 301 /funktionen/; }
    location = /daten.html          { return 301 /funktionen/; }
    location = /system-01.html      { return 301 /funktionen/; }
    location = /schnittstellen.html { return 301 /funktionen/#schnittstellen; }
    location = /datenbank.html      { return 301 /; }
    location = /download.html       { return 301 /download/; }
    location = /support.html        { return 301 /support/; }
    location = /kontakt2.html       { return 301 /support/; }
    location = /impressum.html      { return 301 /impressum/; }
    location = /datenschutz.html    { return 301 /datenschutz/; }

    # --- Downloads -----------------------------------------------------------
    location /media/files/ {
        alias /var/www/downloads/mvs/files/;
        include snippets/lgf-security-headers.conf;
    }

    # --- MVS-Serverdienste (TODO Erich: Pfade und Ziel prüfen) ---------------
    # location /MvsClient/ { proxy_pass http://<mvs-server>/MvsClient/; }
    # location /api/       { proxy_pass http://<mvs-server>/api/; }

    # --- Seiten -------------------------------------------------------------
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include snippets/lgf-security-headers.conf;
    }
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/lgf-security-headers.conf;
    }

    error_page 404 /404.html;
}
