# Testhosts (mvstest, mdstest, ...) nicht in Suchmaschinen aufnehmen.
# Ablage: /etc/nginx/conf.d/00-lgf-robots-map.conf (http-Ebene, vor den Sites)
# Leerer Wert = nginx sendet den Header X-Robots-Tag gar nicht (Live-Hosts).

map $host $lgf_robots {
    default          "";
    ~^[a-z]+test\.   "noindex, nofollow";
}
